[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudscale-data-platform"
version = "0.1.0"
description = "A production-oriented Azure data engineering platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "azure-storage-file-datalake>=12.16,<13.0",
    "azure-identity>=1.19,<2.0",
]

[project.scripts]
cloudscale-produce-orders = "cloudscale_data_platform.producer.cli:main"
cloudscale-ingest-raw = "cloudscale_data_platform.ingestion.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudscale_data_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
